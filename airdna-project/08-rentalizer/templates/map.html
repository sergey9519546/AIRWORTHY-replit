<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRWORTHY — California &amp; Florida Market Map</title>
    <meta name="description" content="Explore short-term rental listings and revenue across California and Florida markets.">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/map.css" />
</head>
<body class="map-body">

    <!-- Full-screen map -->
    <div id="map"></div>

    <!-- Floating search bar (top center) -->
    <div class="map-searchbar" id="map-searchbar">
        <div class="map-searchbar-inner">
            <div class="map-searchbar-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <div class="map-searchbar-text">
                <span class="map-searchbar-title" id="searchbar-title">California &amp; Florida</span>
                <span class="map-searchbar-sub" id="searchbar-sub">Loading listings…</span>
            </div>
            <div class="map-searchbar-divider"></div>
            <button class="map-searchbar-filters" id="toggle-sidebar"
                    aria-label="Toggle filter sidebar" aria-expanded="true" aria-controls="map-sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                <span class="filter-badge" id="filter-badge" aria-label="active filters" hidden>0</span>
            </button>
        </div>
    </div>

    <!-- City chips — populated dynamically by map.js -->
    <div class="map-chips" id="map-chips"></div>

    <!-- Floating sidebar -->
    <aside class="map-sidebar" id="map-sidebar">
        <!-- Header -->
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <svg viewBox="0 0 32 32" class="sidebar-logo-icon" aria-hidden="true">
                    <rect x="1" y="1" width="30" height="30" rx="8" fill="#14151A"/>
                    <rect x="8"  y="18" width="4" height="9"  rx="1.5" fill="#FF6350"/>
                    <rect x="14" y="12" width="4" height="15" rx="1.5" fill="#C6F135"/>
                    <rect x="20" y="6"  width="4" height="21" rx="1.5" fill="#2A55FF"/>
                </svg>
                <span class="sidebar-logo-text">AIRWORTHY</span>
            </div>
            <a href="/" class="sidebar-back">← AIRWORTHY</a>
        </div>

        <!-- Listing count -->
        <div class="sidebar-count">
            <span class="sidebar-count-pulse"><span class="pulse-ring"></span><span class="pulse-dot"></span></span>
            <div>
                <div class="sidebar-count-num" id="visible-count">Loading…</div>
                <div class="sidebar-count-sub">Latest snapshot per city</div>
            </div>
        </div>

        <!-- Scrollable filters -->
        <div class="sidebar-scroll">

            <!-- State -->
            <div class="filter-group">
                <label class="sr-only" for="state-filter">State</label>
                <div class="filter-select-wrap">
                    <select id="state-filter" class="filter-select" aria-label="Filter by state">
                        <option value="">All States</option>
                        <option value="ca">California</option>
                        <option value="fl">Florida</option>
                    </select>
                    <svg class="filter-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <!-- City -->
            <div class="filter-group">
                <label class="sr-only" for="city-filter">City / Region</label>
                <div class="filter-select-wrap">
                    <select id="city-filter" class="filter-select" aria-label="Filter by city or region">
                        <option value="">All Cities</option>
                    </select>
                    <svg class="filter-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <hr class="sidebar-hr">

            <!-- Room type pills -->
            <div class="sidebar-section-label" id="room-type-label" style="margin-bottom: 14px;">Type of place</div>
            <div class="room-pills" id="room-pills" role="group" aria-labelledby="room-type-label">
                <button class="room-pill active" data-value="">All</button>
                <button class="room-pill" data-value="Entire home/apt">Entire home</button>
                <button class="room-pill" data-value="Private room">Private room</button>
                <button class="room-pill" data-value="Hotel room">Hotel</button>
                <button class="room-pill" data-value="Shared room">Shared</button>
            </div>
            <!-- Hidden select for JS compatibility -->
            <select id="room-filter" class="hidden-select" aria-hidden="true">
                <option value="">All</option>
                <option value="Entire home/apt">Entire home/apt</option>
                <option value="Private room">Private room</option>
                <option value="Hotel room">Hotel room</option>
                <option value="Shared room">Shared room</option>
            </select>

            <hr class="sidebar-hr">

            <!-- Price range -->
            <div class="sidebar-section-label" id="price-range-label" style="margin-bottom: 16px;">Price range</div>
            <div class="price-histogram" aria-hidden="true">
                <div class="price-histogram-bar" style="height:4%"></div>
                <div class="price-histogram-bar" style="height:8%"></div>
                <div class="price-histogram-bar" style="height:15%"></div>
                <div class="price-histogram-bar active" style="height:28%"></div>
                <div class="price-histogram-bar active" style="height:42%"></div>
                <div class="price-histogram-bar active" style="height:60%"></div>
                <div class="price-histogram-bar active" style="height:78%"></div>
                <div class="price-histogram-bar active" style="height:95%"></div>
                <div class="price-histogram-bar active" style="height:100%"></div>
                <div class="price-histogram-bar active" style="height:85%"></div>
                <div class="price-histogram-bar active" style="height:68%"></div>
                <div class="price-histogram-bar active" style="height:50%"></div>
                <div class="price-histogram-bar active" style="height:35%"></div>
                <div class="price-histogram-bar active" style="height:22%"></div>
                <div class="price-histogram-bar" style="height:12%"></div>
                <div class="price-histogram-bar" style="height:7%"></div>
                <div class="price-histogram-bar" style="height:4%"></div>
                <div class="price-histogram-bar" style="height:2%"></div>
            </div>
            <div class="price-inputs" role="group" aria-labelledby="price-range-label">
                <div class="price-input-wrap">
                    <label class="price-input-label" for="min-price">Minimum</label>
                    <div class="price-input-inner">
                        <span class="price-symbol" aria-hidden="true">$</span>
                        <input type="number" id="min-price" class="price-input" placeholder="0" min="0" aria-label="Minimum price in dollars">
                    </div>
                </div>
                <span class="price-dash" aria-hidden="true">—</span>
                <div class="price-input-wrap">
                    <label class="price-input-label" for="max-price">Maximum</label>
                    <div class="price-input-inner">
                        <span class="price-symbol" aria-hidden="true">$</span>
                        <input type="number" id="max-price" class="price-input" placeholder="Any" min="0" aria-label="Maximum price in dollars">
                    </div>
                </div>
            </div>

            <hr class="sidebar-hr">

            <!-- Toggles -->
            <div class="toggle-list">
                <label class="toggle-row">
                    <div class="toggle-text">
                        <span class="toggle-title">Guest favorites</span>
                        <span class="toggle-sub">Most loved homes, according to guests</span>
                    </div>
                    <div class="toggle-switch">
                        <input type="checkbox" class="toggle-input" id="toggle-guest-fav">
                        <span class="toggle-track"></span>
                    </div>
                </label>
                <label class="toggle-row">
                    <div class="toggle-text">
                        <span class="toggle-title">Instant Book</span>
                        <span class="toggle-sub">Book without waiting for host approval</span>
                    </div>
                    <div class="toggle-switch">
                        <input type="checkbox" class="toggle-input" id="toggle-instant">
                        <span class="toggle-track"></span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Sticky footer actions -->
        <div class="sidebar-footer">
            <button class="sidebar-clear" id="reset-filters">Clear all</button>
            <button class="sidebar-apply" id="apply-filters">Show results</button>
        </div>
        <!-- Live result count updated by JS -->
        <span id="apply-count" class="sr-only" aria-live="polite"></span>
    </aside>

    <!-- Map legend (bottom-right) -->
    <div class="map-legend">
        <div class="map-legend-title">Map Legend</div>
        <div class="legend-row">
            <span class="legend-dot" style="background:#2A55FF"></span>
            <span class="legend-label">Entire home/apt</span>
        </div>
        <div class="legend-row">
            <span class="legend-dot" style="background:#059669"></span>
            <span class="legend-label">Private room</span>
        </div>
        <div class="legend-row">
            <span class="legend-dot" style="background:#f59e0b"></span>
            <span class="legend-label">Hotel room</span>
        </div>
        <div class="legend-row">
            <span class="legend-dot" style="background:#6b7280"></span>
            <span class="legend-label">Shared room</span>
        </div>
        <div class="legend-attribution">
            Data: <a href="https://insideairbnb.com" target="_blank">InsideAirbnb</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="/static/map.js" defer></script>
</body>
</html>
